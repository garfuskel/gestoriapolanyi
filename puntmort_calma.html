<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestoria Polanyi</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background-color: #f4f6f9;
            padding: 20px;
            box-sizing: border-box;
        }
        
        .card {
            background: white;
            padding: 35px;
            width: 100%;
            max-width: 880px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
            border-radius: 10px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            box-sizing: border-box;
        }

        .header {
            display: flex;
            justify-content: flex-start;
            align-items: center;
            border-bottom: 2px solid #eaeaea;
            padding-bottom: 12px;
        }

        .badge {
            background-color: #004085;
            color: white;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .enunciat {
            font-size: 1.2rem;
            line-height: 1.75;
            color: #2c3e50;
            text-align: justify;
            background-color: #f8f9fa;
            padding: 22px;
            border-left: 5px solid #004085;
            border-radius: 4px;
        }

        .question-box {
            font-size: 1.1rem;
            font-weight: 600;
            color: #c0392b;
            margin-top: 12px;
            display: block;
        }

        .controls {
            border-top: 1px solid #eee;
            padding-top: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            width: 100%;
        }

        .input-group {
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
            justify-content: center;
            width: 100%;
        }

        input {
            padding: 10px 15px;
            width: 240px;
            text-align: center;
            border: 2px solid #ccc;
            font-size: 1.05rem;
            outline: none;
            border-radius: 6px;
            transition: border-color 0.2s;
        }

        input:focus {
            border-color: #004085;
        }

        button {
            padding: 10px 22px;
            cursor: pointer;
            background: #004085;
            color: white;
            border: none;
            font-size: 0.95rem;
            font-weight: 600;
            transition: background 0.2s;
            border-radius: 6px;
        }

        button:hover {
            background: #002752;
        }

        .btn-new {
            background: #6c757d;
        }

        .btn-new:hover {
            background: #5a6268;
        }

        .message-area {
            width: 100%;
        }

        #feedback {
            font-size: 1.1rem;
            font-weight: bold;
            text-align: center;
            margin-bottom: 10px;
        }

        #resolution {
            font-size: 0.95rem;
            color: #2b2b2b;
            text-align: left;
            line-height: 1.7;
            background-color: #ffffff;
            padding: 20px;
            border-radius: 6px;
            border: 1px solid #e0e0e0;
            display: none;
            box-shadow: inset 0 1px 3px rgba(0,0,0,0.05);
        }

        .res-section {
            margin-bottom: 12px;
            padding-bottom: 8px;
            border-bottom: 1px dashed #ddd;
        }

        @media (max-width: 600px) {
            .card { padding: 20px; }
            .enunciat { font-size: 1.05rem; }
            input { width: 100%; }
            .input-group { width: 100%; flex-direction: column; }
            button { width: 100%; }
        }
    </style>
</head>
<body>

<div class="card">
    <div class="header">
        <span class="badge">El punt mort (llindar de rendibilitat)</span>
    </div>

    <div id="enunciat" class="enunciat"></div>

    <div class="controls">
        <div class="input-group">
            <input type="text" id="user-input" placeholder="Introdueix la teva resposta">
            <button onclick="comprovar()">Verificar</button>
            <button class="btn-new" onclick="generar()">Següent exercici</button>
        </div>

        <div class="message-area">
            <div id="feedback"></div>
            <div id="resolution"></div>
        </div>
    </div>
</div>

<script>
    let exerciciActual = {};

    function formatNum(num) {
        if (isNaN(num)) return "0";
        return Number(num.toFixed(2)).toLocaleString('ca-ES', { maximumFractionDigits: 2 });
    }

    function randChoice(arr) {
        return arr[Math.floor(Math.random() * arr.length)];
    }

    function normalitzarEntrada(val) {
        let raw = val.trim().replace(/\s/g, '');
        if (raw.includes(',') && raw.includes('.')) {
            raw = raw.replace(/\./g, '').replace(',', '.');
        } else if (raw.includes(',')) {
            raw = raw.replace(',', '.');
        } else if (/^\d{1,3}\.\d{3}$/.test(raw)) {
            raw = raw.replace('.', '');
        }
        return parseFloat(raw);
    }

const NOMS_EMPRESES = [
    "Polanyi, SL", "Aura Farming, SA", "Baleares Tech", "Mar i Cel, SL", "SICA", 
    "4MAGSA", "BVB", "Lustros, SA", "CICO", "Ara Anam, SL", 
    "Pint Canàries, SL", "Digital Services, SA", "Ainuchi, SL", "Llevant, SA",
    "Nordic Craft, SL", "Alaior Innovació, SA", "Tramuntana Eco, SL", "Kronos Logistics, SA", "Dalmau & Co, SL",
    "Miramar, SL", "NauticBalear, SA", "Sol i Ombres, SL", "Vectra Indústries, SA", "Fornaris, SL",
    "Llum i Color, SA", "NovaGestió, SL", "S'Espalmador Tech, SL", "Voramar, SA", "Sistemes Ausa, SL",
    "Talaia Solutions, SA", "Productora Migjorn, SL", "IllaBlanca, SA", "Ponentis, SL", "Arxipèlag Manufactures, SA",
    "Capdepera Dissenys, SL", "SIX-SEVEN, SA", "Baleàrica de Serveis, SL", "Verd Natura, SL"
];

const PRODUCTES = [
    "calculadores", "retoladors", "entrepans", "cadires", "ulleres de sol", 
    "mòduls solars", "teclats mecànics", "pots de pintura", "plats de ceràmica", "bicicletes elèctriques",
    "cascs de moto", "botelles reutilitzables", "motxilles escolars", "auriculars sense fil", "làmpades LED",
    "taules de surf", "jaquetes tèrmiques", "rellotges intel·ligents", "botes de muntanya", "cafeteres",
    "matalassos ortopèdics", "ventiladors silenciosos", "maletes de viatge", "impressores 3D", "paquets de cafè ecològic",
    "fundes per a mòbil", "patinets elèctrics", "caixes de fusta decoratives", "jocs de tovalloles", "veles aromàtiques",
    "jocs de taula", "altaveus Bluetooth", "càmeres vintage", "coixins ergonòmics", "ulleres de protecció"
];

    function generarModel1() {
        const emp = randChoice(NOMS_EMPRESES);
        const prod = randChoice(PRODUCTES);
        
        const cfLloguer = (Math.floor(Math.random() * 8) + 2) * 500;
        const cfPersonal = (Math.floor(Math.random() * 10) + 4) * 1000;
        const cfAltres = (Math.floor(Math.random() * 5) + 1) * 500;
        const cfTotal = cfLloguer + cfPersonal + cfAltres;

        const preu = (Math.floor(Math.random() * 15) + 5) * 10;
        const cvu = Math.round(preu * (0.3 + Math.random() * 0.3));
        const mcu = preu - cvu;

        const qStar = Math.ceil((cfTotal / mcu) / 50) * 50;
        const cfAjustat = qStar * mcu; 

        const intro = randChoice([
            `L'empresa ${emp} es dedica a la producció i comercialització de ${prod}. Per al present exercici, la direcció ha estimat les següents despeses d'estructura: lloguer del local (${formatNum(cfLloguer)} €), costos fixos de personal (${formatNum(cfPersonal)} €) i subministraments i altres despeses fixes (${formatNum(cfAjustat - cfLloguer - cfPersonal)} €). El cost variable per cada unitat és de ${formatNum(cvu)} € i el preu de venda s'ha fixat en ${formatNum(preu)} €.`,
            `Per fabricar i vendre ${prod}, la firma ${emp} ha d'assumir uns costs fixos desglossats en: lloguer de les instal·lacions (${formatNum(cfLloguer)} €), mà d'obra fixa (${formatNum(cfPersonal)} €) i altres càrregues fixes (${formatNum(cfAjustat - cfLloguer - cfPersonal)} €). A més, se sap que el cost variable unitari és de ${formatNum(cvu)} € i que el producte es ven a ${formatNum(preu)} € la unitat.`
        ]);

        return {
            enunciat: `${intro}<span class="question-box">Calcula el llindar de rendibilitat o punt mort d'aquesta empresa.</span>`,
            resposta: qStar,
            unitat: "unitats",
            resolucio: `
                <div class="res-section">
                    <strong>1. Identificació de dades:</strong><br>
                    Costs Fixos Totals (CF) = ${formatNum(cfLloguer)} + ${formatNum(cfPersonal)} + ${formatNum(cfAjustat - cfLloguer - cfPersonal)} = <strong>${formatNum(cfAjustat)} €</strong><br>
                    Preu de venda (P) = <strong>${formatNum(preu)} €/unitat</strong><br>
                    Cost Variable Unitari (CVu) = <strong>${formatNum(cvu)} €/unitat</strong>
                </div>
                <div class="res-section">
                    <strong>2. Fórmula del Llindar de Rendibilitat:</strong><br>
                    Q* = CF / (P - CVu)
                </div>
                <div>
                    <strong>3. Càlcul:</strong><br>
                    Q* = ${formatNum(cfAjustat)} / (${formatNum(preu)} - ${formatNum(cvu)}) = ${formatNum(cfAjustat)} / ${formatNum(mcu)} = <strong>${formatNum(qStar)} unitats</strong>.
                </div>`
        };
    }

    function generarModel2() {
        const emp = randChoice(NOMS_EMPRESES);
        const prod = randChoice(PRODUCTES);

        const cf = (Math.floor(Math.random() * 8) + 4) * 2000;
        const cvu = (Math.floor(Math.random() * 6) + 2) * 5;
        const qMax = (Math.floor(Math.random() * 10) + 5) * 500;
        
        const preuMinim = cvu + (cf / qMax);

        const intro = randChoice([
            `L'empresa ${emp} té uns costs fixos totals de ${formatNum(cf)} € i un cost variable unitari de ${formatNum(cvu)} € en la fabricació de ${prod}. Per restriccions de maquinària, la capacitat productiva màxima de la planta és de ${formatNum(qMax)} unitats.`,
            `Un estudi de l'empresa ${emp} indica que per a la producció de ${prod} se suporten uns costs fixos anuals de ${formatNum(cf)} € i un CVu de ${formatNum(cvu)} €. La instal·lació no pot produir més de ${formatNum(qMax)} unitats anuals.`
        ]);

        return {
            enunciat: `${intro}<span class="question-box">Si la capacitat productiva màxima és de ${formatNum(qMax)} unitats, quin preu unitari hauria de fixar l'empresa com a mínim per no tenir pèrdues, però tampoc guanys?</span>`,
            resposta: preuMinim,
            unitat: "€",
            resolucio: `
                <div class="res-section">
                    <strong>1. Condició de Punt Mort (Benefici = 0):</strong><br>
                    En el punt mort, Ingressos Totals (IT) = Costs Totals (CT)<br>
                    P · Q_màx = CF + (CVu · Q_màx)
                </div>
                <div class="res-section">
                    <strong>2. Aïllar el Preu (P):</strong><br>
                    P = CVu + (CF / Q_màx)
                </div>
                <div>
                    <strong>3. Càlcul:</strong><br>
                    P = ${formatNum(cvu)} + (${formatNum(cf)} / ${formatNum(qMax)}) = ${formatNum(cvu)} + ${formatNum(cf / qMax)} = <strong>${formatNum(preuMinim)} €</strong>.
                </div>`
        };
    }

    function generarModel3() {
        const emp = randChoice(NOMS_EMPRESES);
        const prod = randChoice(PRODUCTES);

        const preu = (Math.floor(Math.random() * 10) + 5) * 2;
        const cvu = preu * 0.4;
        const cf = (Math.floor(Math.random() * 6) + 2) * 50000;
        const mcu = preu - cvu;
        const qStar = cf / mcu;
        const vtStar = qStar * preu;

        return {
            enunciat: `L'empresa ${emp} comercialitza ${prod} a un preu de ${formatNum(preu)} € la unitat. Els costs unitaris variables de producció són de ${formatNum(cvu)} € i les càrregues fixes d'estructura anuals ascendeixen a ${formatNum(cf)} €.<br><br><span class="question-box">Quin serà el volum de facturació o xifra de negocis en el punt mort?</span>`,
            resposta: vtStar,
            unitat: "€",
            resolucio: `
                <div class="res-section">
                    <strong>1. Càlcul del Punt Mort en unitats físiques (Q*):</strong><br>
                    Q* = CF / (P - CVu) = ${formatNum(cf)} / (${formatNum(preu)} - ${formatNum(cvu)}) = <strong>${formatNum(qStar)} unitats</strong>.
                </div>
                <div class="res-section">
                    <strong>2. Convertir a Volum de Facturació (VT* = Ingressos en el PM):</strong><br>
                    VT* = Q* · P
                </div>
                <div>
                    <strong>3. Càlcul final:</strong><br>
                    VT* = ${formatNum(qStar)} unitats · ${formatNum(preu)} € = <strong>${formatNum(vtStar)} €</strong>.
                </div>`
        };
    }

    function generarModel4() {
        const emp = randChoice(NOMS_EMPRESES);
        const prod = randChoice(PRODUCTES);

        const preu = (Math.floor(Math.random() * 8) + 5) * 5;
        const cvu = preu * 0.5;
        const cf = (Math.floor(Math.random() * 5) + 2) * 20000;
        const mcu = preu - cvu;
        const qStar = cf / mcu;

        const prodAnual = Math.round(qStar * (1.4 + Math.random() * 0.8));
        const dies = Math.round((qStar / prodAnual) * 365);

        return {
            enunciat: `La companyia ${emp} produeix ${prod} amb un preu unitari de ${formatNum(preu)} € i uns costs variables unitaris de ${formatNum(cvu)} €. Suposant uns costs fixos totals de ${formatNum(cf)} € i estimant una producció anual uniforme de ${formatNum(prodAnual)} unitats durant un any laboral de 365 dies:<br><br><span class="question-box">Quants de dies necessitarà l'empresa per assolir el llindar de rendibilitat?</span>`,
            resposta: dies,
            unitat: "dies",
            resolucio: `
                <div class="res-section">
                    <strong>1. Càlcul del Punt Mort en unitats (Q*):</strong><br>
                    Q* = CF / (P - CVu) = ${formatNum(cf)} / (${formatNum(preu)} - ${formatNum(cvu)}) = <strong>${formatNum(qStar)} unitats</strong>.
                </div>
                <div class="res-section">
                    <strong>2. Proporció temporal sobre l'any (365 dies):</strong><br>
                    Dies = (Q* / Producció Anual) · 365
                </div>
                <div>
                    <strong>3. Càlcul final:</strong><br>
                    Dies = (${formatNum(qStar)} / ${formatNum(prodAnual)}) · 365 = <strong>${formatNum(dies)} dies</strong>.
                </div>`
        };
    }

    function generarModel5() {
        const emp = randChoice(NOMS_EMPRESES);
        const prod = randChoice(PRODUCTES);

        const qReal = (Math.floor(Math.random() * 8) + 4) * 1000;
        const preu = Math.floor(Math.random() * 15) + 10;
        const cvuPct = 0.3;
        const cvu = preu * cvuPct;
        
        const ingressos = qReal * preu;
        const cf = (Math.floor(Math.random() * 6) + 3) * 10000;
        const ctReal = cf + (cvu * qReal);
        const bReal = ingressos - ctReal;

        const qExact = cf / (preu - cvu);
        const qStar = Math.ceil(qExact);

        let explArrodoniment = qExact !== qStar 
            ? ` = ${formatNum(qExact)} → <strong>${formatNum(qStar)} unitats</strong> (s'arrodoneix al sencer superior)`
            : ` = <strong>${formatNum(qStar)} unitats</strong>`;

        return {
            enunciat: `Durant l'exercici anterior, l'empresa ${emp} va obtenir uns beneficis de ${formatNum(bReal)} € en vendre ${formatNum(qReal)} unitats de ${prod} (tota la seva producció). Durant l'any va assumir uns costs totals de ${formatNum(ctReal)} €, essent el cost variable equivalent a un 30% del preu unitari de venda.<br><br><span class="question-box">Calcula el punt mort o llindar de rendibilitat en aquestes condicions.</span>`,
            resposta: qStar,
            unitat: "unitats",
            resolucio: `
                <div class="res-section">
                    <strong>1. Càlcul dels Ingressos Totals i del Preu (P):</strong><br>
                    Ingressos Totals (IT) = Costs Totals + Benefici = ${formatNum(ctReal)} + ${formatNum(bReal)} = <strong>${formatNum(ingressos)} €</strong><br>
                    Preu (P) = IT / Q = ${formatNum(ingressos)} / ${formatNum(qReal)} = <strong>${formatNum(preu)} €/unitat</strong>
                </div>
                <div class="res-section">
                    <strong>2. Càlcul del CVu i dels Costs Fixos (CF):</strong><br>
                    CVu = 30% de ${formatNum(preu)} = <strong>${formatNum(cvu)} €/unitat</strong><br>
                    CV Totals = CVu · Q = ${formatNum(cvu)} · ${formatNum(qReal)} = ${formatNum(cvu * qReal)} €<br>
                    CF = Costs Totals - CV Totals = ${formatNum(ctReal)} - ${formatNum(cvu * qReal)} = <strong>${formatNum(cf)} €</strong>
                </div>
                <div>
                    <strong>3. Càlcul del Punt Mort:</strong><br>
                    Q* = CF / (P - CVu) = ${formatNum(cf)} / (${formatNum(preu)} - ${formatNum(cvu)})${explArrodoniment}.
                </div>`
        };
    }

    function generarModel6() {
        const emp = randChoice(NOMS_EMPRESES);
        const prod = randChoice(PRODUCTES);

        const cf = (Math.floor(Math.random() * 8) + 4) * 2500;
        const preu = (Math.floor(Math.random() * 10) + 4) * 10;
        const cvu = preu * 0.5;
        const mcu = preu - cvu;

        const bTarget = (Math.floor(Math.random() * 6) + 2) * 5000;
        const qExact = (cf + bTarget) / mcu;
        const qTarget = Math.ceil(qExact);

        let explArrodoniment = qExact !== qTarget 
            ? ` = ${formatNum(qExact)} → <strong>${formatNum(qTarget)} unitats</strong> (s'arrodoneix cap amunt al següent número sencer)`
            : ` = <strong>${formatNum(qTarget)} unitats</strong>`;

        return {
            enunciat: `L'empresa ${emp} fabrica ${prod} suportant uns costs fixos estructurals de ${formatNum(cf)} € anuals. El cost variable unitari és de ${formatNum(cvu)} € i el preu de venda al mercat s'estableix en ${formatNum(preu)} € per unitat.<br><br><span class="question-box">Quantes unitats haurà de produir i vendre l'empresa si pretén obtenir un benefici net de ${formatNum(bTarget)} €?</span>`,
            resposta: qTarget,
            unitat: "unitats",
            resolucio: `
                <div class="res-section">
                    <strong>1. Equació de Benefici:</strong><br>
                    Benefici (B) = (P · Q) - CF - (CVu · Q)<br>
                    B = Q · (P - CVu) - CF
                </div>
                <div class="res-section">
                    <strong>2. Aïllar la quantitat (Q):</strong><br>
                    Q = (CF + B) / (P - CVu)
                </div>
                <div>
                    <strong>3. Càlcul:</strong><br>
                    Q = (${formatNum(cf)} + ${formatNum(bTarget)}) / (${formatNum(preu)} - ${formatNum(cvu)})<br>
                    Q = ${formatNum(cf + bTarget)} / ${formatNum(mcu)}${explArrodoniment}.
                </div>`
        };
    }

    function generarModel7() {
        const emp = randChoice(NOMS_EMPRESES);
        const prod = randChoice(PRODUCTES);

        const cf = (Math.floor(Math.random() * 6) + 4) * 2000;
        const pctCV = (Math.floor(Math.random() * 3) + 3) * 10;
        const esPerdua = Math.random() < 0.35;
        const b = (Math.floor(Math.random() * 4) + 2) * 1000 * (esPerdua ? -1 : 1);

        const volumVendes = (cf + b) / (1 - (pctCV / 100));

        const textB = esPerdua 
            ? `obtingui unes pèrdues de ${formatNum(Math.abs(b))} €` 
            : `obtingui un benefici de ${formatNum(b)} €`;

        return {
            enunciat: `Determina el volum de vendes en què l'empresa ${emp}, dedicada a la fabricació de ${prod}, ${textB}. Considera que els seus costs fixos totals són de ${formatNum(cf)} € i els costs variables totals representen un ${pctCV}% sobre les vendes.<br><br><span class="question-box">Quin és el volum de facturació total necessari?</span>`,
            resposta: volumVendes,
            unitat: "€",
            resolucio: `
                <div class="res-section">
                    <strong>1. Plantejament de l'equació de Benefici:</strong><br>
                    Benefici (B) = Vendes (V) - Costs Fixos (CF) - Costs Variables (CV)<br>
                    Com que CV = ${pctCV}% de V (${pctCV / 100} · V):<br>
                    B = V - CF - ${pctCV / 100}·V
                </div>
                <div class="res-section">
                    <strong>2. Aïllar el volum de Vendes (V):</strong><br>
                    V · (1 - ${pctCV / 100}) = CF + B<br>
                    V = (CF + B) / (1 - ${pctCV / 100})
                </div>
                <div>
                    <strong>3. Càlcul:</strong><br>
                    V = (${formatNum(cf)} + ${formatNum(b)}) / ${formatNum(1 - pctCV / 100)} = <strong>${formatNum(volumVendes)} €</strong>.
                </div>`
        };
    }

    function generarModel8() {
        const emp = randChoice(NOMS_EMPRESES);
        const prod = randChoice(PRODUCTES);

        const cf1 = (Math.floor(Math.random() * 5) + 3) * 5000;
        const cvu1 = (Math.floor(Math.random() * 5) + 2) * 2;
        const preu = cvu1 + 15;

        const incCFpct = 20;
        const incCVu = 3;
        
        const cf2 = cf1 * (1 + incCFpct / 100);
        const cvu2 = cvu1 + incCVu;
        const mcu2 = preu - cvu2;
        const qExact = cf2 / mcu2;
        const qStar2 = Math.ceil(qExact);

        let explArrodoniment = qExact !== qStar2 
            ? ` = ${formatNum(qExact)} → <strong>${formatNum(qStar2)} unitats</strong> (s'arrodoneix al sencer superior)`
            : ` = <strong>${formatNum(qStar2)} unitats</strong>`;

        return {
            enunciat: `L'empresa ${emp} produeix ${prod} amb uns costs fixos inicials de ${formatNum(cf1)} €, uns costs variables unitaris de ${formatNum(cvu1)} € i un preu de venda unitari de ${formatNum(preu)} €.<br><br>Si per a l'any vinent els costs fixos s'incrementen en un ${incCFpct}%, els costs variables unitaris augmenten en ${formatNum(incCVu)} € per unitat i el preu de venda es manté constant:<br><br><span class="question-box">Quin serà el nou punt mort d'aquesta empresa?</span>`,
            resposta: qStar2,
            unitat: "unitats",
            resolucio: `
                <div class="res-section">
                    <strong>1. Recàlcul dels nous paràmetres de cost:</strong><br>
                    Nou CF = ${formatNum(cf1)} · (1 + 0,20) = <strong>${formatNum(cf2)} €</strong><br>
                    Nou CVu = ${formatNum(cvu1)} + ${formatNum(incCVu)} = <strong>${formatNum(cvu2)} €/unitat</strong><br>
                    Preu (P) = <strong>${formatNum(preu)} €/unitat</strong> (es manté)
                </div>
                <div class="res-section">
                    <strong>2. Aplicació de la fórmula del Punt Mort:</strong><br>
                    Nou Q* = Nou CF / (P - Nou CVu)
                </div>
                <div>
                    <strong>3. Càlcul:</strong><br>
                    Nou Q* = ${formatNum(cf2)} / (${formatNum(preu)} - ${formatNum(cvu2)}) = ${formatNum(cf2)} / ${formatNum(mcu2)}${explArrodoniment}.
                </div>`
        };
    }

    function generarModel9() {
        const emp = randChoice(NOMS_EMPRESES);
        const prod = randChoice(PRODUCTES);

        const preu = (Math.floor(Math.random() * 8) + 4) * 10;
        const cvu = preu * 0.4;
        const mcu = preu - cvu;
        const qStar = (Math.floor(Math.random() * 5) + 2) * 1000;
        const cf = qStar * mcu;

        const pctSobra = (Math.floor(Math.random() * 4) + 2) * 10;
        const qReal = qStar * (1 + pctSobra / 100);
        const benefici = (qReal - qStar) * mcu;

        return {
            enunciat: `L'empresa ${emp} té uns costs fixos totals de ${formatNum(cf)} €, un CVu de ${formatNum(cvu)} € i ven el seu producte, ${prod}, a ${formatNum(preu)} € la unitat.<br><br><span class="question-box">Quin benefici obtindria l'empresa si produís i vengués un ${pctSobra}% per damunt del seu punt mort o llindar de rendibilitat?</span>`,
            resposta: benefici,
            unitat: "€",
            resolucio: `
                <div class="res-section">
                    <strong>1. Càlcul del Punt Mort base (Q*):</strong><br>
                    Q* = CF / (P - CVu) = ${formatNum(cf)} / (${formatNum(preu)} - ${formatNum(cvu)}) = <strong>${formatNum(qStar)} unitats</strong>.
                </div>
                <div class="res-section">
                    <strong>2. Càlcul del nou nivell de producció (Q):</strong><br>
                    Q = Q* · (1 + ${pctSobra / 100}) = ${formatNum(qStar)} · ${1 + pctSobra / 100} = <strong>${formatNum(qReal)} unitats</strong>.
                </div>
                <div>
                    <strong>3. Càlcul del Benefici obtingut:</strong><br>
                    B = (Q - Q*) · (P - CVu)<br>
                    B = (${formatNum(qReal)} - ${formatNum(qStar)}) · (${formatNum(preu)} - ${formatNum(cvu)}) = ${formatNum(qReal - qStar)} · ${formatNum(mcu)} = <strong>${formatNum(benefici)} €</strong>.
                </div>`
        };
    }

    function generarModel10() {
        const emp = randChoice(NOMS_EMPRESES);
        const prod = randChoice(PRODUCTES);

        const cf = (Math.floor(Math.random() * 5) + 3) * 10000;
        const cvu = 10;
        const preu1 = 20;
        const b1 = (Math.floor(Math.random() * 4) + 2) * 5000;

        const pctIncB = 20;
        const b2 = b1 * (1 + pctIncB / 100);

        const preu2 = 25;
        const mcu2 = preu2 - cvu;
        const q2Exact = (cf + b2) / mcu2;
        const q2 = Math.ceil(q2Exact);

        let explArrodoniment = q2Exact !== q2 
            ? ` = ${formatNum(q2Exact)} → <strong>${formatNum(q2)} unitats</strong> (s'arrodoneix cap amunt al següent número sencer)`
            : ` = <strong>${formatNum(q2)} unitats</strong>`;

        return {
            enunciat: `L'empresa ${emp} comercialitza ${prod}. Durant el darrer exercici va assolir un benefici de ${formatNum(b1)} € assumint uns costs fixos de ${formatNum(cf)} € i un CVu de ${formatNum(cvu)} €.<br><br>Per al pròxim període pretén que el seu benefici augmenti un ${pctIncB}% respecte a l'any anterior. Si fa comptes augmentar el preu de venda a ${formatNum(preu2)} €/unitat (mantenint invariables els costs fixos i el cost variable unitari):<br><br><span class="question-box">Quantes unitats haurà de vendre en aquest pròxim període?</span>`,
            resposta: q2,
            unitat: "unitats",
            resolucio: `
                <div class="res-section">
                    <strong>1. Càlcul del nou Benefici Objectiu (B2):</strong><br>
                    B2 = ${formatNum(b1)} · (1 + 0,20) = <strong>${formatNum(b2)} €</strong>
                </div>
                <div class="res-section">
                    <strong>2. Plantejament de la fórmula amb el nou preu (P2 = ${formatNum(preu2)} €):</strong><br>
                    Q2 = (CF + B2) / (P2 - CVu)
                </div>
                <div>
                    <strong>3. Càlcul final:</strong><br>
                    Q2 = (${formatNum(cf)} + ${formatNum(b2)}) / (${formatNum(preu2)} - ${formatNum(cvu)})<br>
                    Q2 = ${formatNum(cf + b2)} / ${formatNum(mcu2)}${explArrodoniment}.
                </div>`
        };
    }

    function generarModel11() {
        const emp = randChoice(NOMS_EMPRESES);
        const prod = randChoice(PRODUCTES);

        const preu = (Math.floor(Math.random() * 10) + 4) * 10;
        const cvu = Math.round(preu * 0.4);
        const mcu = preu - cvu;
        
        const qVendes = (Math.floor(Math.random() * 8) + 4) * 500;
        const bReal = (Math.floor(Math.random() * 6) + 2) * 3000;
        
        const cfCalculat = (qVendes * mcu) - bReal;
        const qExact = cfCalculat / mcu;
        const qStar = Math.ceil(qExact);

        let explArrodoniment = qExact !== qStar 
            ? ` = ${formatNum(qExact)} → <strong>${formatNum(qStar)} unitats</strong> (s'arrodoneix cap amunt al següent número sencer)`
            : ` = <strong>${formatNum(qStar)} unitats</strong>`;

        return {
            enunciat: `L'empresa ${emp} ha comercialitzat en el darrer any ${formatNum(qVendes)} unitats de ${prod} a un preu de ${formatNum(preu)} €/unitat, obtenint un benefici net de ${formatNum(bReal)} €. Se sap que el cost variable unitari és de ${formatNum(cvu)} €.<br><br><span class="question-box">Calcula el punt mort o llindar de rendibilitat en unitats físiques.</span>`,
            resposta: qStar,
            unitat: "unitats",
            resolucio: `
                <div class="res-section">
                    <strong>1. Deducció dels Costs Fixos (CF):</strong><br>
                    Marge de Contribució Unitari (MCU) = P - CVu = ${formatNum(preu)} - ${formatNum(cvu)} = <strong>${formatNum(mcu)} €/unitat</strong><br>
                    Benefici (B) = (Q · MCU) - CF &nbsp;⇒&nbsp; CF = (Q · MCU) - B<br>
                    CF = (${formatNum(qVendes)} unitats · ${formatNum(mcu)} €) - ${formatNum(bReal)} € = ${formatNum(qVendes * mcu)} - ${formatNum(bReal)} = <strong>${formatNum(cfCalculat)} €</strong>
                </div>
                <div class="res-section">
                    <strong>2. Càlcul del Punt Mort (Q*):</strong><br>
                    Q* = CF / (P - CVu)
                </div>
                <div>
                    <strong>3. Resultat:</strong><br>
                    Q* = ${formatNum(cfCalculat)} / ${formatNum(mcu)}${explArrodoniment}.
                </div>`
        };
    }

    function generarModel12() {
        const emp = randChoice(NOMS_EMPRESES);
        const prod = randChoice(PRODUCTES);

        const preu = (Math.floor(Math.random() * 8) + 5) * 10;
        const cvu = preu * 0.5;
        const mcu = preu - cvu;

        const msPct = (Math.floor(Math.random() * 4) + 2) * 10;
        const qReal = (Math.floor(Math.random() * 6) + 4) * 1000;
        
        const qStarExact = qReal * (1 - (msPct / 100));
        const qStar = Math.ceil(qStarExact);
        const cfCalculat = qStarExact * mcu;

        return {
            enunciat: `La companyia ${emp} produeix actualment ${formatNum(qReal)} unitats de ${prod}. Segons l'equip d'auditoria, l'empresa treballa amb un marge de seguretat del ${msPct}% respecte al seu punt mort (és a dir, les seves vendes actuals se situen un ${msPct}% per damunt del llindar de rendibilitat). Se sap que el preu de venda és de ${formatNum(preu)} € i el CVu és de ${formatNum(cvu)} €.<br><br><span class="question-box">Quin és el punt mort o llindar de rendibilitat d'aquesta empresa?</span>`,
            resposta: qStar,
            unitat: "unitats",
            resolucio: `
                <div class="res-section">
                    <strong>1. Concepte de Marge de Seguretat (MS):</strong><br>
                    El Marge de Seguretat representa el percentatge en què les vendes actuals (Q_real) superen el Punt Mort (Q*):<br>
                    MS (%) = [(Q_real - Q*) / Q_real] · 100<br>
                    També expressat com: Q* = Q_real · (1 - MS / 100)
                </div>
                <div class="res-section">
                    <strong>2. Càlcul del Punt Mort (Q*):</strong><br>
                    Q* = ${formatNum(qReal)} · (1 - ${formatNum(msPct / 100)}) = ${formatNum(qReal)} · ${formatNum(1 - msPct / 100)} = <strong>${formatNum(qStar)} unitats</strong>.
                </div>
                <div>
                    <strong>3. Deducció addicional de Costs Fixos (comprovació):</strong><br>
                    CF = Q* · (P - CVu) = ${formatNum(qStar)} · (${formatNum(preu)} - ${formatNum(cvu)}) = <strong>${formatNum(cfCalculat)} €</strong>.
                </div>`
        };
    }

    function generarModel13() {
        const emp = randChoice(NOMS_EMPRESES);
        const prod = randChoice(PRODUCTES);

        const qReal = (Math.floor(Math.random() * 5) + 3) * 2000;
        const itTotal = qReal * 40; 
        const preu = itTotal / qReal;
        
        const pctCV = 60;
        const cvu = preu * (pctCV / 100);
        const mcu = preu - cvu;

        const cfCalculat = (Math.floor(Math.random() * 5) + 3) * 8000;
        const ctTotal = cfCalculat + (cvu * qReal);

        const qExact = cfCalculat / mcu;
        const qStar = Math.ceil(qExact);

        let explArrodoniment = qExact !== qStar 
            ? ` = ${formatNum(qExact)} → <strong>${formatNum(qStar)} unitats</strong> (s'arrodoneix cap amunt al següent número sencer)`
            : ` = <strong>${formatNum(qStar)} unitats</strong>`;

        return {
            enunciat: `L'empresa ${emp} ha registrat una facturació total (IT) de ${formatNum(itTotal)} € en vendre ${formatNum(qReal)} unitats de ${prod}. Els seus costs totals (CT) en aquest nivell de producció han estat de ${formatNum(ctTotal)} €. L'estudi de costos de l'empresa revela que els costs variables representen exactament un ${pctCV}% sobre el volum de vendes totals.<br><br><span class="question-box">Calcula el punt mort o llindar de rendibilitat en unitats.</span>`,
            resposta: qStar,
            unitat: "unitats",
            resolucio: `
                <div class="res-section">
                    <strong>1. Càlcul del Preu (P) i del CVu:</strong><br>
                    Preu (P) = IT / Q_real = ${formatNum(itTotal)} / ${formatNum(qReal)} = <strong>${formatNum(preu)} €/unitat</strong><br>
                    CV Totals = ${pctCV}% de IT = ${formatNum(pctCV / 100)} · ${formatNum(itTotal)} = <strong>${formatNum(itTotal * (pctCV / 100))} €</strong><br>
                    CVu = CV Totals / Q_real = ${formatNum(itTotal * (pctCV / 100))} / ${formatNum(qReal)} = <strong>${formatNum(cvu)} €/unitat</strong>
                </div>
                <div class="res-section">
                    <strong>2. Càlcul dels Costs Fixos (CF):</strong><br>
                    CF = Costs Totals - Costs Variables Totals = ${formatNum(ctTotal)} - ${formatNum(itTotal * (pctCV / 100))} = <strong>${formatNum(cfCalculat)} €</strong>
                </div>
                <div>
                    <strong>3. Càlcul del Punt Mort (Q*):</strong><br>
                    Q* = CF / (P - CVu) = ${formatNum(cfCalculat)} / (${formatNum(preu)} - ${formatNum(cvu)}) = ${formatNum(cfCalculat)} / ${formatNum(mcu)}${explArrodoniment}.
                </div>`
        };
    }

    function generarModel14() {
        const emp = randChoice(NOMS_EMPRESES);
        const prod = randChoice(PRODUCTES);

        const preu = (Math.floor(Math.random() * 5) + 5) * 10;
        const cvu = preu * 0.5;
        const mcu = preu - cvu;

        const qVendes = (Math.floor(Math.random() * 6) + 4) * 1000;
        const mcTotal = qVendes * mcu;
        const bReal = mcTotal * 0.4;
        const cfCalculat = mcTotal - bReal;

        const qExact = cfCalculat / mcu;
        const qStar = Math.ceil(qExact);

        let explArrodoniment = qExact !== qStar 
            ? ` = ${formatNum(qExact)} → <strong>${formatNum(qStar)} unitats</strong> (s'arrodoneix cap amunt al següent número sencer)`
            : ` = <strong>${formatNum(qStar)} unitats</strong>`;

        return {
            enunciat: `L'empresa ${emp} ven ${prod} a un preu de ${formatNum(preu)} €/unitat amb un cost variable unitari de ${formatNum(cvu)} €. En el darrer exercici, el seu marge de contribució total (Diferència entre Ingressos Totals i Costs Variables Totals) va ser de ${formatNum(mcTotal)} €, aconseguint un benefici final de ${formatNum(bReal)} €.<br><br><span class="question-box">Calcula el punt mort o llindar de rendibilitat en unitats físiques.</span>`,
            resposta: qStar,
            unitat: "unitats",
            resolucio: `
                <div class="res-section">
                    <strong>1. Càlcul dels Costs Fixos (CF):</strong><br>
                    Sabem que Benefici = Marge de Contribució Total - Costs Fixos<br>
                    CF = Marge de Contribució Total - Benefici<br>
                    CF = ${formatNum(mcTotal)} € - ${formatNum(bReal)} € = <strong>${formatNum(cfCalculat)} €</strong>
                </div>
                <div class="res-section">
                    <strong>2. Càlcul del Marge de Contribució Unitari (MCU):</strong><br>
                    MCU = P - CVu = ${formatNum(preu)} - ${formatNum(cvu)} = <strong>${formatNum(mcu)} €/unitat</strong>
                </div>
                <div>
                    <strong>3. Càlcul del Punt Mort (Q*):</strong><br>
                    Q* = CF / MCU = ${formatNum(cfCalculat)} / ${formatNum(mcu)}${explArrodoniment}.
                </div>`
        };
    }

    function generar() {
        document.getElementById('feedback').innerText = '';
        const resEl = document.getElementById('resolution');
        resEl.style.display = 'none';
        resEl.innerHTML = '';
        document.getElementById('user-input').value = '';

        const models = [
            generarModel1, generarModel2, generarModel3, generarModel4, generarModel5,
            generarModel6, generarModel7, generarModel8, generarModel9, generarModel10,
            generarModel11, generarModel12, generarModel13, generarModel14
        ];
        
        const triat = randChoice(models);
        exerciciActual = triat();

        document.getElementById('enunciat').innerHTML = exerciciActual.enunciat;
        document.getElementById('user-input').placeholder = `Resposta (${exerciciActual.unitat})`;
    }

    function comprovar() {
        const valStr = document.getElementById('user-input').value;
        const feedback = document.getElementById('feedback');
        const resEl = document.getElementById('resolution');

        if (!valStr.trim()) {
            feedback.style.color = "#e67e22";
            feedback.innerText = "Per favor, introdueix un resultat.";
            return;
        }

        const userVal = normalitzarEntrada(valStr);

        if (isNaN(userVal)) {
            feedback.style.color = "#e67e22";
            feedback.innerText = "Format no vàlid. Introdueix un número.";
            return;
        }

        const esCorrecte = Math.abs(userVal - exerciciActual.resposta) < 0.5;

        if (esCorrecte) {
            feedback.style.color = "#28a745";
            feedback.innerText = `Excel·lent! Resposta correcta: ${formatNum(exerciciActual.resposta)} ${exerciciActual.unitat}.`;
        } else {
            feedback.style.color = "#dc3545";
            feedback.innerText = `Incorrecte. La resposta correcta era ${formatNum(exerciciActual.resposta)} ${exerciciActual.unitat}.`;
        }

        resEl.innerHTML = exerciciActual.resolucio;
        resEl.style.display = 'block';
    }

    window.onload = generar;
</script>
