<html lang="ca" translate="no">

  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <title>EcoLingo - Gestoria Polanyi</title>
  <style>
    body {
      font-family: 'Nunito', 'Segoe UI', sans-serif;
      background-color: #ffffff;
      color: #3c3c3c;
      display: flex;
      flex-direction: column;
      align-items: center;
      margin: 0;
      padding: 0;
      height: 100vh;
      height: 100dvh; 
      overflow: hidden; 
      box-sizing: border-box;
    }
    
    .screen-wrapper {
      width: 100%;
      max-width: 600px;
      display: flex;
      flex-direction: column;
      height: 100%;
      padding: 15px 20px; 
      box-sizing: border-box;
    }

    /* --- MENÚ PRINCIPAL I PERSONALITZADA --- */
    #menu-screen, #custom-screen {
      justify-content: center;
      align-items: center;
      text-align: center;
    }
    .app-title {
      font-size: 3rem;
      font-weight: 900;
      color: #58cc02;
      margin-bottom: 10px;
      letter-spacing: -1px;
    }
    .app-subtitle {
      font-size: 1.2rem;
      color: #afafaf;
      margin-bottom: 40px;
      font-weight: bold;
    }
    .menu-btn {
      width: 100%;
      background: #ffffff; border: 2px solid #e5e5e5; border-radius: 15px; padding: 20px;
      font-size: 1.2rem; font-weight: bold; cursor: pointer; text-align: center;
      transition: all 0.1s ease; color: #4b4b4b; box-shadow: 0 4px 0 rgba(0,0,0,0.05);
      margin-bottom: 15px;
    }
    .menu-btn:active { transform: translateY(4px); box-shadow: 0 0 0 rgba(0,0,0,0); }
    .menu-btn.primary { background: #58cc02; color: white; border-color: #58cc02; box-shadow: 0 4px 0 #58a700; }
    .menu-btn.primary:active { box-shadow: 0 0 0 #58a700; }
    .menu-btn.secondary { background: #1cb0f6; color: white; border-color: #1cb0f6; box-shadow: 0 4px 0 #1899d6; }
    .menu-btn.secondary:active { box-shadow: 0 0 0 #1899d6; }
    .menu-btn.danger { background: #ff4b4b; color: white; border-color: #ff4b4b; box-shadow: 0 4px 0 #ea2b2b; }
    .menu-btn.danger:active { box-shadow: 0 0 0 #ea2b2b; }

    .custom-options { width: 100%; text-align: left; margin-bottom: 30px; overflow-y: auto; max-height: 50vh; }
    .checkbox-label {
      display: flex; align-items: center; gap: 10px; font-size: 1.1rem; font-weight: bold;
      padding: 15px; border: 2px solid #e5e5e5; border-radius: 15px; margin-bottom: 10px; cursor: pointer;
      color: #4b4b4b; transition: background 0.2s;
    }
    .checkbox-label:hover { background: #f7f9fa; }
    .checkbox-label input { width: 22px; height: 22px; accent-color: #1cb0f6; cursor: pointer; }

    /* --- JOC PRINCIPAL --- */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 15px; 
      gap: 15px;
      flex-shrink: 0; 
    }
    .stats-group { display: flex; gap: 15px; }
    .lives { color: #ff4b4b; font-weight: bold; font-size: 1.2rem; display: flex; align-items: center; gap: 5px; }
    
    .progress-bar-container { flex-grow: 1; background-color: #e5e5e5; height: 16px; border-radius: 10px; overflow: hidden; }
    .progress-bar-fill { background-color: #58cc02; height: 100%; width: 0%; border-radius: 10px; transition: width 0.3s ease; }

    /* Barra del Temporitzador (Mode Infinit) */
    #timer-bar-wrapper { width: 100%; margin-bottom: 15px; display: none; }
    .timer-bar-container { width: 100%; background-color: #e5e5e5; height: 12px; border-radius: 10px; overflow: hidden; }
    .timer-bar-fill { background-color: #ff9600; height: 100%; width: 100%; border-radius: 10px; transition: width 0.1s linear; }

    #question-area { 
      flex-grow: 1; 
      display: flex; 
      flex-direction: column; 
      overflow-y: auto; 
      padding-bottom: 10px;
    }
    
    .question-instruction {
      font-size: 1rem; font-weight: bold; color: #afafaf; margin-bottom: 8px;
      text-transform: uppercase; letter-spacing: 0.5px; flex-shrink: 0;
    }
    
    .question-content {
      font-size: 1.3rem; font-weight: 800; margin-bottom: 20px;
      color: #3c3c3c; line-height: 1.3; flex-shrink: 0;
    }
    
    .options { display: flex; flex-direction: column; gap: 10px; flex-shrink: 0; }
    .option-btn {
      background: #ffffff; border: 2px solid #e5e5e5; border-radius: 15px; padding: 15px;
      font-size: 1.1rem; font-weight: bold; cursor: pointer; text-align: left;
      transition: all 0.1s ease; color: #4b4b4b; box-shadow: 0 4px 0 rgba(0,0,0,0.05);
    }
    .option-btn:hover { background: #f7f7f7; }
    .option-btn.selected { background: #ddf4ff; border-color: #1cb0f6; color: #1899d6; box-shadow: 0 4px 0 #1899d6; }
    .option-btn.correct { background: #d7ffb8; border-color: #58cc02; color: #58a700; box-shadow: 0 4px 0 #58a700; }
    .option-btn.wrong { background: #ffdfe0; border-color: #ea2b2b; color: #ea2b2b; box-shadow: 0 4px 0 #ea2b2b; }

    .text-input {
      width: 100%; padding: 15px; border: 2px solid #e5e5e5; border-radius: 15px;
      font-size: 1.2rem; font-weight: bold; box-sizing: border-box; color: #3c3c3c;
    }
    .text-input:focus { outline: none; border-color: #1cb0f6; background: #ddf4ff; }
    .text-input.correct { background: #d7ffb8; border-color: #58cc02; color: #58a700; }
    .text-input.wrong { background: #ffdfe0; border-color: #ea2b2b; color: #ea2b2b; }

    .order-area { display: flex; flex-wrap: wrap; gap: 8px; min-height: 50px; padding: 12px; border-radius: 15px; }
    .order-area.target { border: 2px dashed #afafaf; margin-bottom: 10px; background: #f7f9fa; transition: background 0.2s; }
    .order-area.source { border: 2px solid transparent; padding: 0;}
    .fragment-btn {
      background: #ffffff; border: 2px solid #e5e5e5; border-radius: 10px; padding: 8px 12px;
      font-size: 1rem; font-weight: bold; cursor: pointer; color: #4b4b4b; box-shadow: 0 2px 0 rgba(0,0,0,0.05);
      transition: transform 0.1s;
    }
    .fragment-btn:hover { background: #f0f0f0; transform: scale(1.02); }

    .footer { border-top: 2px solid #e5e5e5; padding-top: 15px; margin-top: auto; flex-shrink: 0; display: flex; gap: 10px; }
    #action-btn {
      flex-grow: 1; background: #e5e5e5; color: #afafaf; border: none; border-radius: 15px;
      padding: 16px; font-size: 1.2rem; font-weight: bold; text-transform: uppercase; cursor: not-allowed;
      box-shadow: 0 4px 0 #afafaf; transition: all 0.1s;
    }
    #action-btn.active { background: #58cc02; color: white; cursor: pointer; box-shadow: 0 4px 0 #58a700; }
    #action-btn.active:active { transform: translateY(4px); box-shadow: 0 0 0 #58a700; }
    #action-btn.wrong-state { background: #ea2b2b; box-shadow: 0 4px 0 #c11f1f; color: white; }

    /* Històric de Resultats */
    #history-container {
      margin-top: 15px; text-align: left; background: #f7f9fa; border: 2px solid #e5e5e5;
      border-radius: 15px; padding: 15px; overflow-y: auto; flex-grow: 1; display: flex; flex-direction: column;
    }
    .history-title { font-size: 1rem; font-weight: bold; color: #afafaf; margin-bottom: 10px; text-transform: uppercase; }
    .history-item { border-bottom: 2px solid #e5e5e5; margin-bottom: 5px; }
    .history-item:last-child { border-bottom: none; margin-bottom: 0; }
    .history-summary {
      display: flex; justify-content: space-between; align-items: center; padding: 10px 0; 
      font-size: 1.1rem; color: #4b4b4b; cursor: pointer; list-style: none;
    }
    .history-summary::-webkit-details-marker { display: none; }
    .history-summary:hover { color: #1cb0f6; }
    .history-definition {
      padding: 10px; margin-bottom: 10px; background: #ffffff; border-radius: 10px; 
      border: 1px solid #e5e5e5; font-size: 0.95rem; color: #555; line-height: 1.4;
    }

    /* Animacions */
    @keyframes pop { 0% { transform: scale(1); } 50% { transform: scale(1.3); } 100% { transform: scale(1); } }
    .pop-anim { animation: pop 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) both; display: inline-block; }
    @keyframes shake { 0%, 100% { transform: translateX(0); } 20%, 60% { transform: translateX(-8px); } 40%, 80% { transform: translateX(8px); } }
    .shake { animation: shake 0.4s cubic-bezier(.36,.07,.19,.97) both; }
    
    .hidden { display: none !important; }
    #result-area { text-align: center; margin-top: 10px; flex-grow: 1; display: flex; flex-direction: column; overflow: hidden; }
    #result-area h1 { font-size: 2rem; margin-bottom: 5px; }
    .streak-final { color: #ff9600; font-weight: bold; font-size: 1.3rem; display: flex; align-items: center; justify-content: center; margin-bottom: 5px; gap: 5px; }
    .lesson-score { display: flex; align-items: center; justify-content: center; font-size: 1.2rem; font-weight: bold; margin-bottom: 5px; gap: 5px; }
    .buttons-row { display: flex; gap: 10px; margin-top: 15px; flex-shrink: 0; }
  </style>
</head>

    <button class="menu-btn danger" onclick="setMode('infinite')">♾️ Mode Infinit</button>

    <div class="custom-options" id="custom-options-container">
      </div>

    <button class="menu-btn" onclick="goMainMenu()">Tornar al menú</button>

  <div id="game-wrapper" class="screen-wrapper hidden">

      </div>
      <div class="progress-bar-container" id="main-progress-container"><div class="progress-bar-fill" id="progress-bar"></div></div>
    </div>

    <div id="timer-bar-wrapper">
      <div class="timer-bar-container"><div class="timer-bar-fill" id="timer-bar"></div></div>
    </div>

    <div id="question-area">

      <div class="question-content" id="question-content"></div>
      
      <div class="options" id="options-container"></div>
      <div id="feedback-msg" style="margin-top: 10px; font-weight: bold; font-size: 1.1rem; display: none; flex-shrink: 0;"></div>
    </div>

    <div id="result-area" class="hidden">
      <h1 id="result-title"></h1>
      <p id="result-msg" style="font-size: 1rem; color: #777; margin-bottom: 10px; flex-shrink: 0;"></p>
      
      <div id="stats-container">
        <div class="streak-final">🔥 Ratxa diària: <span id="final-streak-count">0</span></div>
        <div class="lesson-score">⏱️ Temps: <span id="lesson-time" style="display:inline-block;">0:00</span></div>
        <div class="lesson-score" id="lesson-score-div">🎯 Encert: <span id="lesson-accuracy" style="display:inline-block;">0</span>%</div>
      </div>
      
      <div id="history-container">
        <div class="history-title">Resum de la sessió (Clica per repassar)</div>
        <div id="history-list"></div>
      </div>

      <div class="buttons-row">
        <button id="restart-btn" class="menu-btn primary" style="margin-bottom:0;" onclick="resetGame()">Torna a jugar</button>
        <button class="menu-btn" style="margin-bottom:0;" onclick="goMainMenu()">Menú</button>
      </div>
    </div>

    <div class="footer" id="game-footer">
      <button id="action-btn" disabled>Comprova</button>
    </div>
  </div>

    // SISTEMA DE SO
    const AudioContext = window.AudioContext || window.webkitAudioContext;
    const audioCtx = new AudioContext();

    function playSound(type) {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const gainNode = audioCtx.createGain();
      osc.connect(gainNode);
      gainNode.connect(audioCtx.destination);
      const now = audioCtx.currentTime;
      
      if (type === 'correct') {
        osc.type = 'sine'; osc.frequency.setValueAtTime(523.25, now); osc.frequency.setValueAtTime(659.25, now + 0.1); 
        gainNode.gain.setValueAtTime(0.5, now); gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
        osc.start(now); osc.stop(now + 0.3);
      } else if (type === 'wrong') {
        osc.type = 'sawtooth'; osc.frequency.setValueAtTime(150, now); osc.frequency.setValueAtTime(100, now + 0.15);
        gainNode.gain.setValueAtTime(0.5, now); gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
        osc.start(now); osc.stop(now + 0.3);
      } else if (type === 'win') {
        osc.type = 'square'; osc.frequency.setValueAtTime(261.63, now); osc.frequency.setValueAtTime(329.63, now + 0.15);
        osc.frequency.setValueAtTime(392.00, now + 0.3); osc.frequency.setValueAtTime(523.25, now + 0.45);
        gainNode.gain.setValueAtTime(0.3, now); gainNode.gain.linearRampToValueAtTime(0, now + 0.8);
        osc.start(now); osc.stop(now + 0.8);
      } else if (type === 'lose') {
        osc.type = 'triangle'; osc.frequency.setValueAtTime(329.63, now); osc.frequency.setValueAtTime(293.66, now + 0.2);
        osc.frequency.setValueAtTime(261.63, now + 0.4); osc.frequency.setValueAtTime(246.94, now + 0.6);
        gainNode.gain.setValueAtTime(0.5, now); gainNode.gain.linearRampToValueAtTime(0, now + 1);
        osc.start(now); osc.stop(now + 1);
      }
    }

    function animateCounter(elementId, targetValue, duration) {
      const element = document.getElementById(elementId);
      element.classList.remove('pop-anim');
      let startTimestamp = null;
      const step = (timestamp) => {
        if (!startTimestamp) startTimestamp = timestamp;
        const progress = Math.min((timestamp - startTimestamp) / duration, 1);
        element.textContent = Math.floor(progress * targetValue);
        if (progress < 1) window.requestAnimationFrame(step);
        else element.classList.add('pop-anim');
      };
      window.requestAnimationFrame(step);
    }

    function animateTime(elementId, targetSeconds, duration) {
      const element = document.getElementById(elementId);
      element.classList.remove('pop-anim');
      let startTimestamp = null;
      const step = (timestamp) => {
        if (!startTimestamp) startTimestamp = timestamp;
        const progress = Math.min((timestamp - startTimestamp) / duration, 1);
        const currentSecs = Math.floor(progress * targetSeconds);
        const m = Math.floor(currentSecs / 60);
        const s = currentSecs % 60;
        element.textContent = `${m}:${s < 10 ? '0' : ''}${s}`;
        if (progress < 1) window.requestAnimationFrame(step);
        else element.classList.add('pop-anim');
      };
      window.requestAnimationFrame(step);
    }

    function checkStreak() {
      const lastWinDate = localStorage.getItem('ecolingo_last_win');
      const today = new Date().toDateString();
      let streak = parseInt(localStorage.getItem('ecolingo_streak')) || 0;
      if (lastWinDate) {
        const diffDays = Math.ceil(Math.abs(new Date(today) - new Date(lastWinDate)) / (1000 * 60 * 60 * 24));
        if (diffDays > 1) { streak = 0; localStorage.setItem('ecolingo_streak', streak); }
      }
      return streak;
    }

    function updateStreakOnWin() {
      const lastWinDate = localStorage.getItem('ecolingo_last_win');
      const today = new Date().toDateString();
      let streak = parseInt(localStorage.getItem('ecolingo_streak')) || 0;
      if (lastWinDate !== today) {
        streak++; 
        localStorage.setItem('ecolingo_streak', streak); 
        localStorage.setItem('ecolingo_last_win', today);
      }
      return streak;
    }

    function shuffle(array) {
      for (let i = array.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [array[i], array[j]] = [array[j], array[i]];
      }
      return array;
    }

    // LÒGICA DEL TEMPORITZADOR (MODE INFINIT)
    function startTimer() {
      if (gameMode !== 'infinite') return;
      stopTimer();
      timerBarFill.style.width = '100%';
      timerBarFill.style.backgroundColor = '#ff9600';
      
      let lastTime = Date.now();
      timerInterval = setInterval(() => {
        let now = Date.now();
        let delta = now - lastTime;
        lastTime = now;
        currentTimeMs -= delta;
        
        let percent = (currentTimeMs / maxTimeMs) * 100;
        timerBarFill.style.width = `${Math.max(0, percent)}%`;
        
        if (percent < 25) timerBarFill.style.backgroundColor = '#ea2b2b';
        else timerBarFill.style.backgroundColor = '#ff9600';

        if (currentTimeMs <= 0) {
          stopTimer();
          handleTimeout();
        }
      }, 50);
    }

    function stopTimer() {
      if (timerInterval) { clearInterval(timerInterval); timerInterval = null; }
    }

      actionBtn.disabled = true;
      actionBtn.classList.add('wrong-state');
      actionBtn.textContent = 'Temps Esgotat!';
      setTimeout(nextStep, 1500); 
    }

    // GENERACIÓ DE PREGUNTES (Ara utilitzant activeDb per escollir preguntes)
    function generateQuestion() {
      if (!activeDb || activeDb.length === 0) return;

      optionsContainer.innerHTML = '';
      feedbackMsg.style.display = 'none';
      questionState = 'answering';
      selectedButton = null;
      gameWrapper.classList.remove('shake');

      actionBtn.textContent = 'Comprova';
      actionBtn.className = '';
      actionBtn.onclick = checkAnswer;

      const modes = ['multiple-choice', 'true-false', 'write', 'order', 'fill-blank'];
      currentMode = modes[Math.floor(Math.random() * modes.length)];

      if (currentMode === 'multiple-choice') {
        questionInstruction.textContent = "A quin concepte correspon aquesta definició?";
        questionContent.textContent = `"${currentConcept.definicio_correcta}"`;
        currentCorrectAnswer = currentConcept.terme;
        
        // Cerca de distractors dins del mateix tema si n'hi ha prou, sinó a tota la base general
        let falsos = activeDb.filter(c => c.terme !== currentConcept.terme);
        if (falsos.length < 2) falsos = db.filter(c => c.terme !== currentConcept.terme);
        falsos = falsos.sort(() => 0.5 - Math.random()).slice(0, 2);
        
        renderOptions(shuffle([currentConcept.terme, falsos[0].terme, falsos[1].terme]));
      } 
      else if (currentMode === 'true-false') {
        const isTrue = Math.random() > 0.5;
        let defToShow = currentConcept.definicio_correcta;
        if (!isTrue) {
          let fakeConceptList = activeDb.filter(c => c.terme !== currentConcept.terme);
          if (fakeConceptList.length === 0) fakeConceptList = db.filter(c => c.terme !== currentConcept.terme);
          const fakeConcept = fakeConceptList[Math.floor(Math.random() * fakeConceptList.length)];
          defToShow = fakeConcept.definicio_correcta;
        }
        questionInstruction.textContent = "Vertader o Fals?";
        questionContent.textContent = `La definició de "${currentConcept.terme}" és: "${defToShow}"`;
        currentCorrectAnswer = isTrue ? 'Vertader' : 'Fals';
        renderOptions(['Vertader', 'Fals']);
      }
      else if (currentMode === 'write') {
        questionInstruction.textContent = "Escriu el concepte que correspon a aquesta definició:";
        questionContent.textContent = `"${currentConcept.definicio_correcta}"`;
        currentCorrectAnswer = currentConcept.terme.toLowerCase(); // Pel feedback
        const input = document.createElement('input');
        input.type = 'text'; input.id = 'write-input'; input.className = 'text-input';
        input.placeholder = 'Escriu el terme aquí...'; input.autocomplete = 'off';
        input.addEventListener('input', (e) => {
          if(e.target.value.trim().length > 0) { actionBtn.disabled = false; actionBtn.classList.add('active'); } 
          else { actionBtn.disabled = true; actionBtn.classList.remove('active'); }
        });
        optionsContainer.appendChild(input);
        setTimeout(() => input.focus(), 100);
      }
      else if (currentMode === 'order') {
        questionInstruction.textContent = "Ordena els fragments per formar la definició de:";
        questionContent.textContent = `"${currentConcept.terme}"`;
        currentCorrectAnswer = currentConcept.fragments_definicio.join(' ');
        
        const targetArea = document.createElement('div'); targetArea.className = 'order-area target'; targetArea.id = 'target-area';
        const sourceArea = document.createElement('div'); sourceArea.className = 'order-area source'; sourceArea.id = 'source-area';
        
        optionsContainer.appendChild(targetArea);
        optionsContainer.appendChild(sourceArea);

        let fragments = [...currentConcept.fragments_definicio];
        
        let fakeConceptList = activeDb.filter(c => c.terme !== currentConcept.terme);
        if (fakeConceptList.length === 0) fakeConceptList = db.filter(c => c.terme !== currentConcept.terme);
        
        let fakeConcept = fakeConceptList[Math.floor(Math.random() * fakeConceptList.length)];
        if (fakeConcept && fakeConcept.fragments_definicio.length > 0) {
            let validFakesForOrder = fakeConcept.fragments_definicio.filter(f => !currentConcept.fragments_definicio.includes(f));
            if(validFakesForOrder.length > 0) {
                let fakeFragment = validFakesForOrder[Math.floor(Math.random() * validFakesForOrder.length)];
                fragments.push(fakeFragment);
            }
        }

        fragments = shuffle(fragments);

        fragments.forEach(frag => {
          const btn = document.createElement('div');
          btn.className = 'fragment-btn'; btn.textContent = frag;
          btn.onclick = () => {
            if (questionState !== 'answering') return;
            if (btn.parentElement.id === 'source-area') { targetArea.appendChild(btn); } else { sourceArea.appendChild(btn); }
            
            if (targetArea.children.length > 0) { actionBtn.disabled = false; actionBtn.classList.add('active'); } 
            else { actionBtn.disabled = true; actionBtn.classList.remove('active'); }
          };
          sourceArea.appendChild(btn);
        });
      }
      else if (currentMode === 'fill-blank') {
        const fragmentIndex = Math.floor(Math.random() * currentConcept.fragments_definicio.length);
        const hideWord = currentConcept.fragments_definicio[fragmentIndex];
        
        let modifiedDef = currentConcept.definicio_correcta.replace(hideWord, "________");
        if (modifiedDef === currentConcept.definicio_correcta) {
             let parts = [...currentConcept.fragments_definicio];
             parts[fragmentIndex] = "________";
             modifiedDef = parts.join(" ");
        }
        
        questionInstruction.textContent = `Completa la definició de "${currentConcept.terme}":`;
        questionContent.textContent = `"${modifiedDef}"`;
        currentCorrectAnswer = hideWord;
        
        let allOtherFragments = [];
        activeDb.forEach(c => {
            if (c.terme !== currentConcept.terme) {
                let frag = c.fragments_definicio[fragmentIndex] || c.fragments_definicio[0];
                allOtherFragments.push(frag);
            }
        });
        
        let uniqueFakes = [...new Set(allOtherFragments)].filter(f => f !== hideWord);
        // Si no hi ha prou fakes al tema, tirem de tota la bd
        if (uniqueFakes.length < 2) {
           db.forEach(c => {
               if (c.terme !== currentConcept.terme) {
                   let frag = c.fragments_definicio[fragmentIndex] || c.fragments_definicio[0];
                   uniqueFakes.push(frag);
               }
           });
           uniqueFakes = [...new Set(uniqueFakes)].filter(f => f !== hideWord);
        }
        
        uniqueFakes = shuffle(uniqueFakes);
        const fake1 = uniqueFakes[0] || "un impost indirecte";
        const fake2 = uniqueFakes[1] || "dels mercats financers";
        
        renderOptions(shuffle([hideWord, fake1, fake2]));
      }

      if (gameMode === 'infinite') {
        currentTimeMs = maxTimeMs;
        startTimer();
      }
    }

    function renderOptions(opts) {
      opts.forEach(opt => {
        const btn = document.createElement('button');
        btn.className = 'option-btn'; btn.textContent = opt;
        btn.onclick = () => selectOption(btn);
        optionsContainer.appendChild(btn);
      });
    }

    function selectOption(btn) {
      if (questionState !== 'answering') return;
      const allBtns = document.querySelectorAll('.option-btn');
      allBtns.forEach(b => b.classList.remove('selected'));
      btn.classList.add('selected');
      selectedButton = btn;
      actionBtn.disabled = false;
      actionBtn.classList.add('active');
    }

    function checkAnswer() {
      stopTimer(); 
      questionState = 'checking';
      let isCorrect = false;

      if (currentMode === 'multiple-choice' || currentMode === 'true-false' || currentMode === 'fill-blank') {
        isCorrect = (selectedButton.textContent === currentCorrectAnswer);
        const allBtns = document.querySelectorAll('.option-btn');
        allBtns.forEach(b => {
          b.onclick = null; 
          if (b.textContent === currentCorrectAnswer) b.classList.add('correct');
        });
        if (!isCorrect) selectedButton.classList.add('wrong');
      } 
      else if (currentMode === 'write') {
        const input = document.getElementById('write-input');
        input.disabled = true;
        const userInput = input.value.trim().toLowerCase();
        
        const mainAns = currentConcept.terme.toLowerCase();
        let altAnsList = currentConcept.termes_alternatius || [];
        
        // Comprovació incloent tots els possibles termes alternatius afegits
        isCorrect = (userInput === mainAns || altAnsList.some(alt => alt.trim().toLowerCase() === userInput));

        if (isCorrect) input.classList.add('correct');
        else {
          input.classList.add('wrong');
          feedbackMsg.style.display = 'block'; feedbackMsg.style.color = '#ea2b2b';
          let correctText = currentConcept.terme;
          if (altAnsList.length > 0) {
             correctText += ` (o ${altAnsList.join(' / ')})`;
          }
          feedbackMsg.textContent = `La resposta correcta era: ${correctText}`;
        }
      }
      else if (currentMode === 'order') {
        const targetArea = document.getElementById('target-area');
        const userOrder = Array.from(targetArea.children).map(b => b.textContent).join(' ');
        isCorrect = (userOrder === currentCorrectAnswer);
        Array.from(targetArea.children).forEach(b => {
          b.style.borderColor = isCorrect ? '#58cc02' : '#ea2b2b';
          b.style.background = isCorrect ? '#d7ffb8' : '#ffdfe0';
        });
        if (!isCorrect) {
          feedbackMsg.style.display = 'block'; feedbackMsg.style.color = '#ea2b2b';
          feedbackMsg.textContent = `La resposta correcta era: ${currentConcept.definicio_correcta}`;
        }
      }

      gameHistory.push({ terme: currentConcept.terme, correct: isCorrect });

      if (isCorrect) {
        playSound('correct'); 
        currentQuestionCount++; 
        updateProgress(); 
        
        if (gameMode === 'infinite') {
           maxTimeMs = Math.max(30000, maxTimeMs * 0.99);
           actionBtn.disabled = true; 
           actionBtn.textContent = 'Correcte!';
           setTimeout(nextStep, 400); 
        } else {
           actionBtn.textContent = 'Continua';
           actionBtn.onclick = nextStep;
        }
      } else {
        playSound('wrong'); gameWrapper.classList.add('shake'); lives--; livesCount.textContent = lives;
        
        if (gameMode === 'infinite') {
           actionBtn.disabled = true;
           actionBtn.classList.add('wrong-state');
           actionBtn.textContent = 'Incorrecte!';
           setTimeout(nextStep, 1500); 
        } else {
           actionBtn.textContent = 'Continua'; actionBtn.classList.add('wrong-state');
           actionBtn.onclick = nextStep;
        }
      }
    }

    function nextStep() {
      if (lives <= 0) endGame(false);
      else if (currentQuestionCount >= totalQuestions) endGame(true);
      else generateQuestion();
    }

    function endGame(win) {
      stopTimer();
      questionArea.classList.add('hidden'); gameHeader.classList.add('hidden'); gameFooter.classList.add('hidden');
      timerBarWrapper.style.display = 'none';
      resultArea.classList.remove('hidden');
      
      const statsContainer = document.getElementById('stats-container');

      if (win || gameMode === 'infinite') {
        if (win) {
            playSound('win'); 
            document.getElementById('result-title').textContent = '🎉 Lliçó Superada!';
            document.getElementById('result-title').style.color = '#58cc02';
        } else {
            playSound('lose');
            document.getElementById('result-title').textContent = '🏁 Partida Finalitzada';
            document.getElementById('result-title').style.color = '#ff9600';
        }
        
        let finalStreak = win ? updateStreakOnWin() : checkStreak();
        document.getElementById('result-msg').textContent = gameMode === 'infinite' ? `Has arribat a ${currentQuestionCount} preguntes correctes.` : `Molt bona feina completant la lliçó.`;
        
        statsContainer.style.display = 'block';

        let endTime = Date.now();
        let diffSecs = Math.floor((endTime - startTime) / 1000);
        animateTime('lesson-time', diffSecs, 1500);

        let mistakes = (gameMode === 'infinite' && lives <= 0) ? 3 : 3 - lives;
        let totalAttempts = currentQuestionCount + mistakes; 
        let accuracyPercentage = totalAttempts > 0 ? Math.round((currentQuestionCount / totalAttempts) * 100) : 0;
        
        const lessonScoreDiv = document.getElementById('lesson-score-div');
        if (accuracyPercentage >= 80) lessonScoreDiv.style.color = '#58cc02';
        else if (accuracyPercentage >= 50) lessonScoreDiv.style.color = '#ff9600';
        else lessonScoreDiv.style.color = '#ea2b2b';

        animateCounter('lesson-accuracy', accuracyPercentage, 1500);
        document.getElementById('final-streak-count').textContent = finalStreak;

      } else {
        playSound('lose');
        document.getElementById('result-title').textContent = '💔 Sense Vides';
        document.getElementById('result-title').style.color = '#ea2b2b';
        document.getElementById('result-msg').textContent = 'T\'has quedat sense vides. Anima\'t a repetir la lliçó!';
        statsContainer.style.display = 'none';
      }

      historyList.innerHTML = '';
      gameHistory.forEach(item => {
        const details = document.createElement('details');
        details.className = 'history-item';
        
        const conceptData = db.find(c => c.terme === item.terme);
        const definitionText = conceptData ? conceptData.definicio_correcta : "Definició no disponible.";
        
        let statusHtml = item.correct 
          ? "<span style='color: #58cc02; font-weight: bold;'>Encertat</span>" 
          : "<span style='color: #ea2b2b; font-weight: bold;'>Fallat</span>";
        
        details.innerHTML = `
          <summary class="history-summary">
            <span><strong>${item.terme}</strong> ▾</span>
            <span>${statusHtml}</span>
          </summary>
          <div class="history-definition">${definitionText}</div>
        `;
        historyList.appendChild(details);
      });
    }

    function resetGame() {
      if (!activeDb || activeDb.length === 0) return;
      currentQuestionCount = 0;
      lives = 3;
      livesCount.textContent = lives;
      gameHistory = [];
      maxTimeMs = 50000; 
      updateProgress();
      
      resultArea.classList.add('hidden');
      questionArea.classList.remove('hidden');
      gameHeader.classList.remove('hidden');
      gameFooter.classList.remove('hidden');
      if(gameMode === 'infinite') timerBarWrapper.style.display = 'block';
      
      startTime = Date.now(); 
      generateQuestion();
    }

    window.onload = () => {
      checkStreak();
    };
  </script>
</body>
</html>
