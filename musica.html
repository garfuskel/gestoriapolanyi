<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mestre de Tonalitats</title>
    <style>
        :root {
            --primary: #4a90e2;
            --secondary: #6f42c1;
            --success: #28a745;
            --danger: #dc3545;
            --info: #17a2b8;
            --dark: #343a40;
            --bg: #f0f2f5;
        }
        body { 
            font-family: -apple-system, system-ui, sans-serif;
            background: var(--bg);
            margin: 0;
            display: flex;
            justify-content: center;
            padding: 10px;
        }
        .container { width: 100%; max-width: 480px; }
        .card {
            background: white;
            padding: 20px;
            border-radius: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            text-align: center;
        }
        .hidden { display: none !important; }
        button {
            width: 100%;
            padding: 16px;
            margin: 8px 0;
            border: none;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.1s;
        }
        button:active { transform: scale(0.98); }
        .btn-main { background: var(--primary); color: white; }
        .btn-modes { background: var(--info); color: white; }
        .btn-quiz { background: var(--secondary); color: white; }
        .btn-iiv1 { background: var(--dark); color: white; }
        .btn-back { background: #e9ecef; color: #495057; }
        .btn-play { background: #ffc107; color: #333; padding: 10px; margin-top: 10px; }
        
        select, input[type="text"] {
            width: 100%;
            padding: 14px;
            margin: 8px 0;
            border-radius: 10px;
            border: 2px solid #ddd;
            font-size: 1rem;
            box-sizing: border-box;
            text-align: center;
        }

        .info-grid {
            text-align: left;
            max-height: 500px;
            overflow-y: auto;
            margin: 15px 0;
            padding-right: 5px;
        }
        .info-box {
            padding: 15px;
            margin-bottom: 15px;
            border-radius: 12px;
            background: #fff;
            border: 1px solid #e1e4e8;
            border-left: 5px solid var(--primary);
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }
        .mode-box { border-left-color: var(--info); }
        .staff-container {
            width: 100%;
            height: 80px;
            margin-top: 10px;
            background: #fafafa;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .stepper-container, .settings-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #fafafa;
            padding: 15px;
            border-radius: 15px;
            border: 2px solid #ddd;
            margin: 15px 0;
        }
        
        .slider-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            margin: 15px 0;
            background: #f8f9fa;
            padding: 15px;
            border-radius: 15px;
        }
        input[type="range"] {
            width: 100%;
            height: 8px;
            border-radius: 5px;
            background: #ddd;
            outline: none;
            -webkit-appearance: none;
        }
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 25px;
            height: 25px;
            border-radius: 50%;
            background: var(--primary);
            cursor: pointer;
        }

        .btn-step {
            width: 60px;
            height: 60px;
            font-size: 1.8rem;
            border-radius: 12px;
            padding: 0;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
        }
        .btn-step.flat { background: var(--info); }
        .btn-step.sharp { background: var(--danger); }
        .alt-display { font-size: 1.6rem; font-weight: bold; min-width: 100px; text-align: center; color: #333; }

        .feedback { margin: 15px 0; font-weight: bold; font-size: 1.1rem; }
        
        /* Estils específics del II-V-I */
        .chord-display { display: flex; justify-content: center; align-items: center; gap: 12px; margin: 20px 0 5px 0; min-height: 5rem; }
        .chord-active { font-size: 4rem; font-weight: bold; color: var(--dark); transition: all 0.2s ease-in-out; }
        .chord-inactive { font-size: 1.8rem; color: var(--dark); opacity: 0.3; transition: all 0.2s ease-in-out; }
        
        .scale-display { font-size: 1.5rem; color: var(--secondary); font-weight: bold; margin-bottom: 20px; }
        .beat-display { font-size: 2rem; letter-spacing: 10px; margin-bottom: 20px; }
        .next-progression { margin-top: 15px; padding-top: 15px; border-top: 2px dashed #ddd; font-size: 1rem; color: #555; }
        
    </style>
</head>
<body>

<div class="container">
    <div class="card">
        <div id="menu">
            <h1>🎼 Aprenent Música</h1>
            <button class="btn-main" onclick="showSection('learn')">📖 Estudiar Cercle</button>
            <button class="btn-modes" onclick="showSection('modes')">🎹 Estudiar Modes</button>
            <button class="btn-quiz" onclick="startQuizSetup('armadura')">🎯 Test d'Armadures</button>
            <button class="btn-quiz" onclick="startQuizSetup('relatiu')">🔄 Test de Relatius</button>
            <button class="btn-iiv1" onclick="showSection('iiv1')">🎷 Mode II-V-I</button>
        </div>

        <div id="learn" class="hidden">
            <h3>Cercle de Quintes</h3>
            <div id="learn-content" class="info-grid"></div>
            <button class="btn-back" onclick="showSection('menu')">Tornar al Menú</button>
        </div>

        <div id="modes" class="hidden">
            <h3>Els Modes Musicals</h3>
            <div id="modes-content" class="info-grid"></div>
            <button class="btn-back" onclick="showSection('menu')">Tornar al Menú</button>
        </div>

        <div id="quiz-setup" class="hidden">
            <h3>Nivell de Dificultat</h3>
            <p style="color: #555;">Fins a quantes alteracions (♭/♯) vols al test?</p>
            <div class="stepper-container" style="flex-direction: column;">
                <span id="max-alt-display" style="font-size: 2.5rem; font-weight: bold; color: var(--primary);">7</span>
                <input type="range" id="max-alt-slider" min="1" max="7" value="7" oninput="document.getElementById('max-alt-display').innerText = this.value">
            </div>
            <button class="btn-main" onclick="launchQuiz()">Som-hi!</button>
            <button class="btn-back" onclick="showSection('menu')">Cancel·lar</button>
        </div>

        <div id="quiz" class="hidden">
            <h3 id="quiz-title">Test</h3>
            <p id="quiz-question" style="min-height: 3em; display: flex; align-items: center; justify-content: center; font-size: 1.1rem; font-weight: bold;"></p>
            
            <div id="inputs-armadura" class="hidden">
                <div class="stepper-container">
                    <button class="btn-step flat" onclick="changeAlt(-1)">- ♭</button>
                    <div id="alt-display" class="alt-display">0 Cap</div>
                    <button class="btn-step sharp" onclick="changeAlt(1)">+ ♯</button>
                </div>
            </div>

            <div id="inputs-relatiu" class="hidden">
                <input type="text" id="ans-relatiu" placeholder="Nom o xifrat (ex: A-7)">
            </div>

            <div id="feedback" class="feedback"></div>
            <div id="quiz-staff-container" class="staff-container hidden" style="margin-bottom: 15px;"></div>
            
            <button class="btn-main" id="btn-check" onclick="checkAnswer()">Comprova</button>
            <button class="btn-back" id="btn-next" style="display:none; background: var(--success); color:white;" onclick="nextQuestion()">Següent</button>
            <button class="btn-back" onclick="showSection('menu')">Sortir</button>
        </div>

        <div id="iiv1" class="hidden">
            <h3>Pràctica II-V-I</h3>
            
            <select id="iiv1-key-select" style="margin-bottom: 15px; font-weight: bold;" onchange="handleKeySelectChange()">
                <option value="random">🎲 Tonalitat Aleatòria (Infinit)</option>
                </select>

            <div id="iiv1-random-settings" class="slider-container" style="display:flex;">
                <div style="display:flex; justify-content:space-between; width:100%;">
                    <span>Límit d'alteracions (Aleatori):</span>
                    <strong style="color:var(--primary);"><span id="iiv1-max-alt-display">7</span></strong>
                </div>
                <input type="range" id="iiv1-max-alt-slider" min="0" max="7" value="7" oninput="document.getElementById('iiv1-max-alt-display').innerText = this.value; updateNextProgFromSelect()">
            </div>

            <div class="slider-container">
                <div style="display:flex; justify-content:center; width:100%; margin-bottom: 10px; padding-bottom: 10px; border-bottom: 1px solid #ddd;">
                    <label style="cursor:pointer; font-weight:bold; color:var(--dark); display:flex; align-items:center; gap:8px;">
                        <input type="checkbox" id="iiv1-play-chords" checked style="width:20px; height:20px;"> 
                        🎹 Activar Acompanyament (Bb)
                    </label>
                </div>
                
                <div style="display:flex; justify-content:space-between; width:100%;">
                    <span>Tempo:</span>
                    <strong style="color:var(--primary);"><span id="bpm-display">100</span> BPM</strong>
                </div>
                <input type="range" id="bpm-slider" min="60" max="200" value="100" oninput="updateBPM()">
                
                <hr style="width:100%; border:0; border-top:1px dashed #ccc; margin: 10px 0;">
                
                <div style="display:flex; justify-content:space-between; width:100%; font-size: 0.9rem;">
                    <span>🎹 Volum Acords:</span>
                </div>
                <input type="range" id="chord-vol-slider" min="0" max="100" value="50" oninput="updateVolumes()">

                <div style="display:flex; justify-content:space-between; width:100%; font-size: 0.9rem; margin-top: 5px;">
                    <span>🥁 Volum Metrònom:</span>
                </div>
                <input type="range" id="click-vol-slider" min="0" max="100" value="50" oninput="updateVolumes()">
            </div>

            <div style="background: #fafafa; border: 2px solid #ddd; border-radius: 15px; padding: 20px 10px;">
                <div class="beat-display" id="beat-indicator">⭕⭕⭕⭕</div>
                
                <div class="chord-display" id="chord-display"><span class="chord-inactive">--</span></div>
                
                <div class="scale-display" id="scale-display">Mode --</div>
                
                <div style="font-size: 1.1rem; color: #333; font-weight: bold;" id="key-display">Tonalitat: --</div>
                
                <div style="display: flex; justify-content: center; align-items: center; gap: 10px; margin-top: 5px;">
                    <span id="alt-text-display" style="color: #666; font-size: 0.95rem;">Armadura: --</span>
                    <button id="btn-toggle-alt" onclick="toggleAlterations()" style="width: auto; padding: 5px 12px; margin: 0; font-size: 0.85rem; border-radius: 8px; background: #e9ecef; color: #333;">👁️ Oculta</button>
                </div>

                <div class="next-progression">
                    Següent: <br>
                    <strong id="next-prog-display" style="font-size: 1.2rem; color: var(--primary);">--</strong>
                </div>
            </div>

            <button class="btn-main" id="btn-iiv1-toggle" onclick="toggleIIV1()" style="margin-top:20px;">▶ Inicia</button>
            <button class="btn-back" onclick="stopIIV1(); showSection('menu')">Tornar al Menú</button>
        </div>

    </div>
</div>

<script>
    // --- DADES BÀSIQUES ---
    const dades = [
        { major: "Do Major", mc: "C", menor: "La menor", nc: "Am", n: 0, t: "cap", f: 261.63 },
        { major: "Sol Major", mc: "G", menor: "Mi menor", nc: "Em", n: 1, t: "sostinguts", f: 392.00 },
        { major: "Re Major", mc: "D", menor: "Si menor", nc: "Bm", n: 2, t: "sostinguts", f: 293.66 },
        { major: "La Major", mc: "A", menor: "Fa# menor", nc: "F#m", n: 3, t: "sostinguts", f: 440.00 },
        { major: "Mi Major", mc: "E", menor: "Do# menor", nc: "C#m", n: 4, t: "sostinguts", f: 329.63 },
        { major: "Si Major", mc: "B", menor: "Sol# menor", nc: "G#m", n: 5, t: "sostinguts", f: 493.88 },
        { major: "Fa# Major", mc: "F#", menor: "Re# menor", nc: "D#m", n: 6, t: "sostinguts", f: 369.99 },
        { major: "Do# Major", mc: "C#", menor: "La# menor", nc: "A#m", n: 7, t: "sostinguts", f: 277.18 },
        { major: "Fa Major", mc: "F", menor: "Re menor", nc: "Dm", n: 1, t: "bemolls", f: 349.23 },
        { major: "Si b Major", mc: "Bb", menor: "Sol menor", nc: "Gm", n: 2, t: "bemolls", f: 466.16 },
        { major: "Mi b Major", mc: "Eb", menor: "Do menor", nc: "Cm", n: 3, t: "bemolls", f: 311.13 },
        { major: "La b Major", mc: "Ab", menor: "Fa menor", nc: "Fm", n: 4, t: "bemolls", f: 415.30 },
        { major: "Re b Major", mc: "Db", menor: "Si b menor", nc: "Bbm", n: 5, t: "bemolls", f: 277.18 },
        { major: "Sol b Major", mc: "Gb", menor: "Mi b menor", nc: "Ebm", n: 6, t: "bemolls", f: 369.99 },
        { major: "Do b Major", mc: "Cb", menor: "La b menor", nc: "Abm", n: 7, t: "bemolls", f: 246.94 }
    ];

    const iiv1Dades = [
        { key: "C", ii: "D-7", v: "G7", i: "C∆7" },
        { key: "F", ii: "G-7", v: "C7", i: "F∆7" },
        { key: "Bb", ii: "C-7", v: "F7", i: "Bb∆7" },
        { key: "Eb", ii: "F-7", v: "Bb7", i: "Eb∆7" },
        { key: "Ab", ii: "Bb-7", v: "Eb7", i: "Ab∆7" },
        { key: "Db", ii: "Eb-7", v: "Ab7", i: "Db∆7" },
        { key: "Gb", ii: "Ab-7", v: "Db7", i: "Gb∆7" },
        { key: "B", ii: "C#-7", v: "F#7", i: "B∆7" },
        { key: "E", ii: "F#-7", v: "B7", i: "E∆7" },
        { key: "A", ii: "B-7", v: "E7", i: "A∆7" },
        { key: "D", ii: "E-7", v: "A7", i: "D∆7" },
        { key: "G", ii: "A-7", v: "D7", i: "G∆7" }
    ];

    const modesData = [
        { nom: "Jònic (I)", tipus: "Major", notes: "1 2 3 4 5 6 7", desc: "Escala major natural. Alegre i estable." },
        { nom: "Dòric (II)", tipus: "Menor", notes: "1 2 ♭3 4 5 6 ♭7", desc: "Menor amb 6a major. Molt usat en jazz." },
        { nom: "Frigi (III)", tipus: "Menor", notes: "1 ♭2 ♭3 4 5 ♭6 ♭7", desc: "Sona fosc, caràcter espanyol o flamenc." },
        { nom: "Lidi (IV)", tipus: "Major", notes: "1 2 3 ♯4 5 6 7", desc: "Major amb 4a augmentada. Somiador i obert." },
        { nom: "Mixolidi (V)", tipus: "Major", notes: "1 2 3 4 5 6 ♭7", desc: "Major amb 7a menor. Molt usat en blues i rock." },
        { nom: "Eoli (VI)", tipus: "Menor", notes: "1 2 ♭3 4 5 ♭6 ♭7", desc: "Escala menor natural. Trist o èpic." },
        { nom: "Locri (VII)", tipus: "Dism.", notes: "1 ♭2 ♭3 4 ♭5 ♭6 ♭7", desc: "Tensa i inestable. Per a acords semidisminuïts." }
    ];

    window.onload = () => {
        const select = document.getElementById('iiv1-key-select');
        iiv1Dades.forEach(k => {
            select.innerHTML += `<option value="${k.key}">Tonalitat de ${k.key} (${k.ii} - ${k.v} - ${k.i})</option>`;
        });
        
        initLearn();
        initModes();
        updateNextProgFromSelect();
        updateVolumes(); 
    };

    function initLearn() {
        const container = document.getElementById('learn-content');
        dades.forEach(d => {
            container.innerHTML += `
                <div class="info-box">
                    <strong style="font-size:1.2rem; color:var(--primary)">${d.major} (${d.mc})</strong><br>
                    Relatiu menor: ${d.menor} (${d.nc})<br>
                    Armadura: ${textAlteracions(d.n, d.t)}
                </div>
            `;
        });
    }

    function initModes() {
        const container = document.getElementById('modes-content');
        modesData.forEach(m => {
            container.innerHTML += `
                <div class="info-box mode-box">
                    <strong style="font-size:1.2rem; color:var(--info)">${m.nom}</strong> - ${m.tipus}<br>
                    Fórmula: <span style="font-family:monospace; background:#eee; padding:2px 4px; border-radius:4px;">${m.notes}</span><br>
                    <small style="color:#555">${m.desc}</small>
                </div>
            `;
        });
    }

    let audioCtx = null;
    let currentMode = ""; 
    
    // Variables de Volum
    let chordVolFactor = 0.5;
    let clickVolFactor = 0.5;

    function updateVolumes() {
        chordVolFactor = document.getElementById('chord-vol-slider').value / 100;
        clickVolFactor = document.getElementById('click-vol-slider').value / 100;
    }
    
    // --- LÒGICA NAVEGACIÓ ---
    function showSection(id) {
        document.querySelectorAll('.card > div').forEach(d => d.classList.add('hidden'));
        document.getElementById(id).classList.remove('hidden');
    }

    // --- LÒGICA II-V-I ---
    let iiv1Interval = null;
    let isIIV1Playing = false;
    let currentIIV1Prog = null;
    let nextIIV1Prog = null;
    let beatInProg = 0; 
    let currentBPM = 100;
    let isAltVisible = true;

    function handleKeySelectChange() {
        const val = document.getElementById('iiv1-key-select').value;
        document.getElementById('iiv1-random-settings').style.display = (val === 'random') ? 'flex' : 'none';
        updateNextProgFromSelect();
    }

    function toggleAlterations() {
        isAltVisible = !isAltVisible;
        const btn = document.getElementById('btn-toggle-alt');
        btn.innerText = isAltVisible ? "👁️ Oculta" : "👁️ Mostra";
        if(isIIV1Playing) updateIIV1Visuals();
    }

    function updateBPM() {
        currentBPM = document.getElementById('bpm-slider').value;
        document.getElementById('bpm-display').innerText = currentBPM;
        if(isIIV1Playing) {
            clearInterval(iiv1Interval);
            iiv1Interval = setInterval(playMetronomeBeat, 60000 / currentBPM);
        }
    }

    function updateNextProgFromSelect() {
        nextIIV1Prog = generateProgression();
        if (isIIV1Playing) {
            updateIIV1Visuals();
        } else {
            document.getElementById('next-prog-display').innerText = `${nextIIV1Prog.ii} - ${nextIIV1Prog.v} - ${nextIIV1Prog.i} (en ${nextIIV1Prog.key})`;
        }
    }

    function toggleIIV1() {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();

        if (isIIV1Playing) {
            stopIIV1();
        } else {
            startIIV1();
        }
    }

    function startIIV1() {
        isIIV1Playing = true;
        document.getElementById('btn-iiv1-toggle').innerText = "⏹ Atura";
        document.getElementById('btn-iiv1-toggle').style.background = "var(--danger)";
        
        if (!nextIIV1Prog) nextIIV1Prog = generateProgression();
        currentIIV1Prog = nextIIV1Prog;
        nextIIV1Prog = generateProgression();
        beatInProg = 0;
        
        updateIIV1Visuals(); 
        playClick(true); 
        
        if (document.getElementById('iiv1-play-chords').checked) {
            playIIV1Chord(currentIIV1Prog.ii, 4); 
        }

        iiv1Interval = setInterval(playMetronomeBeat, 60000 / currentBPM);
    }

    function stopIIV1() {
        isIIV1Playing = false;
        clearInterval(iiv1Interval);
        document.getElementById('btn-iiv1-toggle').innerText = "▶ Inicia";
        document.getElementById('btn-iiv1-toggle').style.background = "var(--dark)";
        document.getElementById('chord-display').innerHTML = '<span class="chord-inactive">--</span>';
        document.getElementById('scale-display').innerText = "Mode --";
        document.getElementById('key-display').innerText = "Tonalitat: --";
        document.getElementById('alt-text-display').innerText = "Armadura: --";
        document.getElementById('beat-indicator').innerText = "⭕⭕⭕⭕";
        updateNextProgFromSelect(); 
    }

    function generateProgression() {
        const selectorValue = document.getElementById('iiv1-key-select').value;
        if(selectorValue === 'random') {
            const maxAlt = parseInt(document.getElementById('iiv1-max-alt-slider').value);
            const validKeys = dades.filter(d => d.n <= maxAlt).map(d => d.mc);
            const validProgs = iiv1Dades.filter(p => validKeys.includes(p.key));
            
            if(validProgs.length === 0) return iiv1Dades[0]; 
            
            return validProgs[Math.floor(Math.random() * validProgs.length)];
        } else {
            return iiv1Dades.find(p => p.key === selectorValue);
        }
    }

    function playClick(isDownbeat) {
        if (!audioCtx || clickVolFactor === 0) return;
        const now = audioCtx.currentTime;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        
        osc.type = "sine";
        osc.frequency.value = isDownbeat ? 1000 : 700; 
        
        const finalVol = 1.0 * clickVolFactor; 
        
        gain.gain.setValueAtTime(0, now);
        gain.gain.linearRampToValueAtTime(finalVol, now + 0.005);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.1);
        
        osc.start(now);
        osc.stop(now + 0.1);
    }
    
    function playIIV1Chord(chordName, beats) {
        if (!audioCtx || chordVolFactor === 0) return;
        
        const match = chordName.match(/^([A-G][#b]?)(.*)$/);
        if (!match) return;
        const rootStr = match[1];
        const qualStr = match[2].trim();

        const noteMap = { 'C':0, 'C#':1, 'Db':1, 'D':2, 'D#':3, 'Eb':3, 'E':4, 'F':5, 'F#':6, 'Gb':6, 'G':7, 'G#':8, 'Ab':8, 'A':9, 'A#':10, 'Bb':10, 'B':11 };
        const rootOffset = noteMap[rootStr];
        if (rootOffset === undefined) return;

        let startNote = rootOffset + 10;

        let intervals = [];
        if (qualStr === '-7') intervals = [0, 3, 7, 10];
        else if (qualStr === '7') intervals = [0, 4, 7, 10];
        else if (qualStr === '∆7') intervals = [0, 4, 7, 11];
        else intervals = [0, 4, 7];

        const now = audioCtx.currentTime;
        const durationSeconds = beats * (60 / currentBPM);

        const bassVol = 0.8 * chordVolFactor;
        const noteVol = 0.3 * chordVolFactor;

        const bassOsc = audioCtx.createOscillator();
        const bassGain = audioCtx.createGain();
        bassOsc.type = 'triangle';
        bassOsc.connect(bassGain);
        bassGain.connect(audioCtx.destination);
        
        bassGain.gain.setValueAtTime(0, now);
        bassGain.gain.linearRampToValueAtTime(bassVol, now + 0.05);
        bassGain.gain.setValueAtTime(bassVol, now + durationSeconds - 0.05); 
        bassGain.gain.linearRampToValueAtTime(0.001, now + durationSeconds);
        
        bassOsc.frequency.value = 130.81 * Math.pow(2, (startNote - 12) / 12);
        bassOsc.start(now);
        bassOsc.stop(now + durationSeconds);

        intervals.forEach(interval => {
            const f = 130.81 * Math.pow(2, (startNote + interval) / 12);
            
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sine';
            
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            
            gain.gain.setValueAtTime(0, now);
            gain.gain.linearRampToValueAtTime(noteVol, now + 0.05);
            gain.gain.setValueAtTime(noteVol, now + durationSeconds - 0.05);
            gain.gain.linearRampToValueAtTime(0.001, now + durationSeconds);
            
            osc.frequency.value = f;
            osc.start(now);
            osc.stop(now + durationSeconds);
        });
    }

    function playMetronomeBeat() {
        beatInProg++;
        if (beatInProg >= 16) {
            beatInProg = 0;
            currentIIV1Prog = nextIIV1Prog;
            nextIIV1Prog = generateProgression(); 
        }

        const isDownbeat = (beatInProg % 4 === 0);
        playClick(isDownbeat);
        updateIIV1Visuals();
        
        if (document.getElementById('iiv1-play-chords').checked) {
            if (beatInProg === 0) playIIV1Chord(currentIIV1Prog.ii, 4); 
            else if (beatInProg === 4) playIIV1Chord(currentIIV1Prog.v, 4); 
            else if (beatInProg === 8) playIIV1Chord(currentIIV1Prog.i, 8); 
        }
    }

    function updateIIV1Visuals() {
        const compasTime = beatInProg % 4;
        let dots = "";
        for(let i=0; i<4; i++) dots += (i === compasTime) ? "🔴" : "⭕";
        document.getElementById('beat-indicator').innerText = dots;

        const chordDisplay = document.getElementById('chord-display');
        const scaleDisplay = document.getElementById('scale-display');
        
        const cII = currentIIV1Prog.ii;
        const cV = currentIIV1Prog.v;
        const cI = currentIIV1Prog.i;

        // Mostrar tota la progressió destacant l'acord actual
        if (beatInProg < 4) {
            chordDisplay.innerHTML = `<span class="chord-active">${cII}</span><span class="chord-inactive">${cV}</span><span class="chord-inactive">${cI}</span>`;
            scaleDisplay.innerText = "Mode Dòric (II)";
        } else if (beatInProg < 8) {
            chordDisplay.innerHTML = `<span class="chord-inactive">${cII}</span><span class="chord-active">${cV}</span><span class="chord-inactive">${cI}</span>`;
            scaleDisplay.innerText = "Mode Mixolidi (V)";
        } else {
            chordDisplay.innerHTML = `<span class="chord-inactive">${cII}</span><span class="chord-inactive">${cV}</span><span class="chord-active">${cI}</span>`;
            scaleDisplay.innerText = "Mode Jònic (I)";
        }

        document.getElementById('key-display').innerText = `Tonalitat: ${currentIIV1Prog.key} Major`;

        const keyInfo = dades.find(d => d.mc === currentIIV1Prog.key);
        const altText = textAlteracions(keyInfo.n, keyInfo.t);
        document.getElementById('alt-text-display').innerText = isAltVisible ? `Armadura: ${altText}` : `Armadura: ???`;

        document.getElementById('next-prog-display').innerText = `${nextIIV1Prog.ii} - ${nextIIV1Prog.v} - ${nextIIV1Prog.i} (en ${nextIIV1Prog.key})`;
    }

    // --- (Funcions de Tests) ---
    let currentItem={}, currentDades=[], currentAlt=0;

    function drawStaff(num, tipus) {
        let svg = `<svg width="200" height="80" xmlns="http://www.w3.org/2000/svg">`;
        for(let i = 0; i < 5; i++) svg += `<line x1="0" y1="${20 + i*10}" x2="200" y2="${20 + i*10}" stroke="black" stroke-width="1"/>`;
        svg += `<text x="5" y="60" font-size="55" font-family="serif" fill="black">&#119070;</text>`;
        const ySos=[20, 35, 15, 30, 45, 25, 40], yBem=[40, 25, 45, 30, 50, 35, 55];
        for(let i = 0; i < num; i++) {
            let y = tipus === 'sostinguts' ? ySos[i] : yBem[i];
            let symbol = tipus === 'sostinguts' ? '&#9839;' : '&#9837;';
            svg += `<text x="${50 + i*15}" y="${y + 5}" font-size="24" dominant-baseline="middle" font-family="sans-serif">${symbol}</text>`;
        }
        svg += `</svg>`; return svg;
    }

    function textAlteracions(n, t) { return n === 0 ? "Cap" : n === 1 ? (t==="sostinguts"?"1 sostingut":"1 bemoll") : n+" "+t; }

    function changeAlt(d) {
        currentAlt += d;
        if(currentAlt>7) currentAlt=7; if(currentAlt<-7) currentAlt=-7;
        document.getElementById('alt-display').innerText = currentAlt === 0 ? "0 Cap" : currentAlt > 0 ? `${currentAlt} ♯` : `${Math.abs(currentAlt)} ♭`;
    }

    function startQuizSetup(mode) { currentMode = mode; showSection('quiz-setup'); }

    function launchQuiz() {
        const maxAlt = parseInt(document.getElementById('max-alt-slider').value);
        currentDades = dades.filter(item => item.n <= maxAlt);
        showSection('quiz');
        document.getElementById('quiz-title').innerText = currentMode === 'armadura' ? "Quantes en té?" : "Quin és el relatiu?";
        nextQuestion();
    }

    function nextQuestion() {
        currentItem = currentDades[Math.floor(Math.random() * currentDades.length)];
        document.getElementById('feedback').innerText = "";
        document.getElementById('btn-next').style.display = "none";
        document.getElementById('btn-check').style.display = "block";
        document.getElementById('quiz-staff-container').classList.add('hidden');

        if(currentMode === 'armadura') {
            const askMajor = Math.random() > 0.5;
            document.getElementById('quiz-question').innerText = `Armadura de ${askMajor ? currentItem.major + ' (' + currentItem.mc + ')' : currentItem.menor + ' (' + currentItem.nc + ')'}`;
            document.getElementById('inputs-armadura').classList.remove('hidden');
            document.getElementById('inputs-relatiu').classList.add('hidden');
            currentAlt = 0; changeAlt(0);
        } else {
            const askMajor = Math.random() > 0.5;
            currentItem.askMajor = askMajor;
            document.getElementById('quiz-question').innerText = askMajor ? `Escriu el relatiu menor de ${currentItem.major} (${currentItem.mc})` : `Escriu el relatiu major de ${currentItem.menor} (${currentItem.nc})`;
            document.getElementById('inputs-armadura').classList.add('hidden');
            document.getElementById('inputs-relatiu').classList.remove('hidden');
        }
        document.getElementById('ans-relatiu').value = "";
    }

    function checkAnswer() {
        let correct = false;
        const f = document.getElementById('feedback');
        if(currentMode === 'armadura') {
            const n = Math.abs(currentAlt);
            const t = currentAlt === 0 ? "cap" : (currentAlt > 0 ? "sostinguts" : "bemolls");
            correct = (n === currentItem.n && t === currentItem.t);
            f.innerText = correct ? "✅ Molt bé!" : `❌ Té ${textAlteracions(currentItem.n, currentItem.t)}`;
        } else {
            const val = document.getElementById('ans-relatiu').value.toLowerCase().trim();
            const targetNom = currentItem.askMajor ? currentItem.menor : currentItem.major;
            const targetXifrat = currentItem.askMajor ? currentItem.nc : currentItem.mc;
            if(val === targetNom.toLowerCase() || val === targetXifrat.toLowerCase() || val === targetNom.replace(' major', '').toLowerCase() || val === targetNom.replace(' Major', '').toLowerCase()) correct = true;
            f.innerText = correct ? `✅ Correcte! És ${targetNom} (${targetXifrat})` : `❌ No, és ${targetNom} (${targetXifrat})`;
        }
        f.style.color = correct ? "var(--success)" : "var(--danger)";
        document.getElementById('quiz-staff-container').innerHTML = drawStaff(currentItem.n, currentItem.t);
        document.getElementById('quiz-staff-container').classList.remove('hidden');
        document.getElementById('btn-check').style.display = "none";
        document.getElementById('btn-next').style.display = "block";
    }
</script>
